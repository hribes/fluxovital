      <div class="modal fade" id="modalSucesso" tabindex="-1" aria-hidden="true">

              <div class="modal-body d-flex flex-column align-items-center">

                <dotlottie-wc 
                  src="https://lottie.host/92bc73e4-bb18-4d1b-ac1d-d82189b6b288/i3lCOxhG3c.lottie" autoplay loop></dotlottie-wc>

        </div>


  <script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.8.5/dist/dotlottie-wc.js" type="module"></script>

  <script src="../services/bottom_sheet.js"></script>

  <script>
    document.getElementById("btnCheguei").addEventListener("click", function() {
    // Fecha o modal principal
    // Abre o modal de sucesso
    const modalSucesso = new bootstrap.Modal(document.getElementById("modalSucesso"));
    modalSucesso.show();

    // Fecha automaticamente depois de 1,5 segundos e redireciona
setTimeout(() => {
    modalSucesso.hide();

    // remove manualmente o backdrop
    document.querySelectorAll(".modal-backdrop").forEach(b => b.remove());

  }, 1500);
});


  </script>
